<!-- Call to Action Component -->
<section id="contact" class="cta">
    <div class="container">
        <h2 class="cta-title">함께 데이터의 가치를 실현해보세요</h2>
        <p class="cta-description">엔톨로지와 함께라면, 여러분의 데이터가 가진 진정한 잠재력을 발견하고 활용할 수 있습니다.</p>
        <form class="cta-form">
            <input type="email" class="cta-input" placeholder="이메일을 입력하세요" required>
            <button type="submit" class="cta-submit">문의하기</button>
        </form>
    </div>
</section>
